<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Supply &amp; Demand Dashboard — List</title>
<style>
  :root {
    --bg: #0e1117;
    --panel: #161b22;
    --border: #2a3038;
    --text: #e6e6e6;
    --muted: #9aa4af;
    --supply: #2157f3;
    --demand: #ff5d00;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 28px;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: var(--space-3);
    height: 68px;
    padding: 0 var(--space-6);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0; }
  header .page-nav { display: flex; gap: var(--space-3); margin-left: auto; flex-shrink: 0; }
  header .nav-link {
    line-height: 18px;
    white-space: nowrap;
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    border: 1px solid var(--border);
    padding: var(--space-2) var(--space-4);
    border-radius: 8px;
  }
  header .nav-link:hover { border-color: var(--supply); }
  header .nav-link[aria-current="page"] { background: var(--supply); border-color: var(--supply); color: #fff; cursor: default; user-select: none; }

  #toolbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-6);
    border-bottom: 1px solid var(--border);
  }
  #search {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: var(--space-2) var(--space-3);
    border-radius: 8px;
    font-size: 13px;
    width: 220px;
  }
  .filter-btn, .modal-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: var(--space-2) var(--space-4);
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .filter-btn:hover, .modal-btn:hover { border-color: var(--supply); }
  .filter-btn.active { background: var(--supply); border-color: var(--supply); color: #fff; }
  #theme-filter, #sector-filter {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: var(--space-2) var(--space-3);
    border-radius: 8px;
    font-size: 13px;
    max-width: 220px;
  }
  .theme-pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(168, 120, 255, 0.2);
    color: #c3a2ff;
  }
  td.sector, td.industry { color: var(--muted); }
  #count { color: var(--muted); font-size: 12px; margin-left: auto; }

  #table-wrap {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 0 var(--space-6) var(--space-5) 0;
    scrollbar-color: #3a424d var(--bg);
  }
  table { border-collapse: separate; border-spacing: 0; width: calc(100% - var(--space-6)); margin: var(--space-5) 0 0 var(--space-6); font-size: 13px; }
  thead th {
    position: sticky;
    top: 0;
    background: var(--panel);
    text-align: right;
    padding: var(--space-3) var(--space-4);
    border: 1px solid var(--border);
    border-left-width: 0;
    z-index: 1;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    color: var(--muted);
  }
  thead th:hover { color: var(--text); }
  thead th.sorted { color: var(--text); }
  thead th:nth-child(-n+5) { text-align: left; }
  tbody td {
    padding: var(--space-2) var(--space-4);
    border: 1px solid var(--border);
    border-width: 0 1px 1px 0;
    text-align: right;
    white-space: nowrap;
  }
  tbody td:nth-child(-n+5) { text-align: left; }
  tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
  tbody tr:hover { background: rgba(33, 87, 243, 0.12); }
  thead th:first-child, tbody td:first-child {
    border-left-width: 1px;
    position: sticky;
    left: 0;
    z-index: 1;
    box-shadow: inset -1px 0 0 transparent, 4px 0 6px -4px transparent;
    transition: box-shadow .15s ease;
  }
  #table-wrap.scrolled thead th:first-child, #table-wrap.scrolled tbody td:first-child {
    box-shadow: inset -1px 0 0 var(--border), 4px 0 6px -4px rgba(0,0,0,0.6);
  }
  thead th:first-child { z-index: 2; }
  tbody td:first-child { background: var(--bg); }
  tbody tr:nth-child(even) td:first-child { background: linear-gradient(rgba(255,255,255,0.02), rgba(255,255,255,0.02)), var(--bg); }
  tbody tr:hover td:first-child { background: linear-gradient(rgba(33, 87, 243, 0.12), rgba(33, 87, 243, 0.12)), var(--bg); }
  td.symbol { font-weight: 700; }
  td.name { color: var(--muted); }
  .zone-pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .zone-pill.supply { background: rgba(33, 87, 243, 0.22); color: #6f96ff; }
  .zone-pill.demand { background: rgba(255, 93, 0, 0.22); color: #ff9c5c; }
  .zone-pill.none { background: rgba(255,255,255,0.06); color: var(--muted); }
  .cell-link { color: inherit; text-decoration: none; }
  .cell-link:hover { text-decoration: underline; }
  .pos { color: #26a69a; }
  .neg { color: #ef5350; }
  .score-pill {
    display: inline-block;
    min-width: 34px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }
  .score-high { background: rgba(38, 166, 154, 0.22); color: #4fd1c5; }
  .score-mid { background: rgba(255, 200, 0, 0.18); color: #e0c34a; }
  .score-low { background: rgba(239, 83, 80, 0.18); color: #ef8b88; }
  .score-na { background: rgba(255,255,255,0.06); color: var(--muted); font-weight: 600; }
  .flag-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    background: rgba(239, 83, 80, 0.18);
    color: #ef8b88;
    margin: 1px;
  }
  thead th[data-key="note"] { text-align: left; }
  td.note-cell { text-align: left; max-width: 240px; }
  .note-btn {
    display: block;
    width: 100%;
    max-width: 240px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text);
    padding: var(--space-1) var(--space-2);
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .note-btn:hover { border-color: var(--supply); }
  .note-btn.empty { color: var(--muted); opacity: 0.5; }

  #note-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #note-dialog {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: var(--space-5);
    width: min(520px, calc(100vw - 32px));
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }
  #note-title { margin: 0; font-size: 15px; }
  #note-title .muted { color: var(--muted); font-weight: 400; }
  #note-text {
    width: 100%;
    min-height: 160px;
    resize: vertical;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: var(--space-3);
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    line-height: 1.5;
  }
  #note-text:focus { outline: none; border-color: var(--supply); }
  #note-actions { display: flex; align-items: center; gap: var(--space-2); }
  #note-error { color: #ef5350; font-size: 12px; margin-right: auto; }
  #note-hint { color: var(--muted); font-size: 11px; margin-right: auto; }
  #note-save { background: var(--supply); border-color: var(--supply); color: #fff; }
  #note-save:disabled { opacity: 0.6; cursor: default; }
  #empty-note { padding: var(--space-6); color: var(--muted); text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header>
    <h1>Supply &amp; Demand Dashboard</h1>
    <nav class="page-nav">
      <a class="nav-link" aria-current="page">List view</a>
      <a class="nav-link" id="chart-link" href="chart.html">Chart view</a>
      <a class="nav-link" id="insider-link" href="insider.html">Insider trades</a>
    </nav>
  </header>

  <div id="toolbar">
    <input id="search" type="text" placeholder="Filter by ticker, name or note…" autocomplete="off" spellcheck="false" />
    <button class="filter-btn active" data-zone="all">All</button>
    <button class="filter-btn" data-zone="demand">Demand Zone</button>
    <button class="filter-btn" data-zone="deep-demand" id="deep-demand-btn">Demand Low</button>
    <button class="filter-btn" data-zone="supply">Supply Zone</button>
    <select id="theme-filter" title="Filter by AI theme">
      <option value="all">All themes</option>
      <option value="ai">All AI</option>
      <option value="non-ai">Non-AI</option>
    </select>
    <select id="sector-filter" title="Filter by sector">
      <option value="all">All sectors</option>
    </select>
    <span id="count"></span>
  </div>

  <div id="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-key="symbol">Symbol</th>
          <th data-key="name">Name</th>
          <th data-key="aiTheme">AI Theme</th>
          <th data-key="sector">Sector</th>
          <th data-key="industry">Industry</th>
          <th data-key="price">Price</th>
          <th data-key="changePct">Chg %</th>
          <th data-key="zone">Zone</th>
          <th data-key="pegRatio">PEG</th>
          <th data-key="roicPct">ROIC TTM</th>
          <th data-key="psRatio">P/S</th>
          <th data-key="peRatio">P/E</th>
          <th data-key="revenueGrowthPct">Revenue Growth (YoY)</th>
          <th data-key="netMarginPct">Net Profit Margin</th>
          <th data-key="recommendationKey">Rating</th>
          <th data-key="upsidePct">Target Upside</th>
          <th data-key="netOpenMarket" title="Open-market insider purchases minus sales over the last 12 months">Net Open-Market (12M)</th>
          <th data-key="score">Score</th>
          <th>Flags</th>
          <th data-key="note">Note</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <div id="empty-note" class="hidden">No tickers match.</div>
  </div>

  <div id="note-modal" class="hidden">
    <div id="note-dialog" role="dialog" aria-modal="true" aria-labelledby="note-title">
      <h2 id="note-title"></h2>
      <textarea id="note-text" placeholder="Write a note…" spellcheck="false"></textarea>
      <div id="note-actions">
        <span id="note-hint">Ctrl+Enter to save · Esc to cancel</span>
        <span id="note-error" class="hidden"></span>
        <button id="note-cancel" class="modal-btn" type="button">Cancel</button>
        <button id="note-save" class="modal-btn" type="button">Save</button>
      </div>
    </div>
  </div>

  <script src="list.js"></script>
</body>
</html>
