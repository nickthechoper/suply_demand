<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Insider Feed — Supply &amp; Demand Dashboard</title>
<style>
  :root {
    --bg: #0e1117;
    --panel: #161b22;
    --panel-2: #1c222b;
    --border: #2a3038;
    --text: #e6e6e6;
    --muted: #9aa4af;
    --faint: #6b7580;
    --supply: #2157f3;
    --accent: #6f96ff;
    --buy: #26a69a;
    --buy-soft: rgba(38, 166, 154, 0.14);
    --buy-text: #4fd1c5;
    --sell: #ef5350;
    --sell-soft: rgba(239, 83, 80, 0.12);
    --sell-text: #ef8b88;
    --neutral-soft: rgba(255, 255, 255, 0.05);

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 28px;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    background: var(--bg);
    color: var(--text);
  }
  a { color: inherit; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }

  header {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    height: 68px;
    padding: 0 var(--space-6);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0; }
  header .page-nav { display: flex; gap: var(--space-3); margin-left: auto; flex-shrink: 0; }
  header .nav-link {
    line-height: 18px;
    white-space: nowrap;
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    border: 1px solid var(--border);
    padding: var(--space-2) var(--space-4);
    border-radius: 8px;
  }
  header .nav-link:hover { border-color: var(--supply); }
  header .nav-link[aria-current="page"] { background: var(--supply); border-color: var(--supply); color: #fff; cursor: default; user-select: none; }

  main { max-width: 1440px; margin: 0 auto; padding: var(--space-5) var(--space-6) var(--space-6); }

  .title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2) var(--space-3); margin-bottom: var(--space-4); }
  .title-row h2 { margin: 0; font-size: 22px; }
  .title-row .sub { color: var(--muted); font-size: 13px; }
  .title-row .updated { margin-left: auto; color: var(--faint); font-size: 12px; display: flex; align-items: center; gap: var(--space-2); }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
  .segmented {
    display: inline-flex;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
  }
  .segmented button {
    background: none;
    border: 0;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .segmented button:hover { color: var(--text); }
  .segmented button[aria-pressed="true"] { background: var(--supply); color: #fff; font-weight: 600; }
  .segmented.kind button[data-kind="buy"][aria-pressed="true"] { background: var(--buy); color: #04201d; }
  .segmented.kind button[data-kind="sell"][aria-pressed="true"] { background: var(--sell); color: #2b0807; }
  select {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  .toggle:hover { color: var(--text); }
  .toggle[aria-pressed="true"] { color: var(--text); border-color: var(--supply); background: rgba(33, 87, 243, 0.18); }
  .search-field { position: relative; display: flex; align-items: center; margin-left: auto; }
  .search-field svg { position: absolute; left: 10px; color: var(--faint); pointer-events: none; }
  #search {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 8px var(--space-3) 8px 32px;
    border-radius: 8px;
    font-size: 13px;
    width: 280px;
  }
  #search:focus { outline: none; border-color: var(--supply); }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3); margin-bottom: var(--space-3); }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-3) var(--space-4); }
  .kpi .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .kpi .v { font-size: 24px; font-weight: 700; margin-top: 2px; }
  .kpi .n { color: var(--muted); font-size: 12px; }
  .ratio { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 8px; background: var(--neutral-soft); }
  .ratio i { display: block; height: 100%; }
  .buy-text { color: var(--buy-text); }
  .sell-text { color: var(--sell-text); }
  .muted { color: var(--muted); }
  .warn { color: #e0c34a; }

  .leaders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); margin-bottom: var(--space-3); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; }
  .card-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-2) var(--space-3);
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--border);
  }
  .card-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .card-head .hint { color: var(--faint); font-size: 12px; }
  .card-head .count { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }

  .ranked { list-style: none; margin: 0; padding: var(--space-1) 0; }
  .ranked li button {
    width: 100%;
    display: grid;
    grid-template-columns: 64px minmax(0, 1fr) auto;
    gap: 0 var(--space-3);
    align-items: center;
    text-align: left;
    background: none;
    border: 0;
    border-left: 3px solid transparent;
    padding: 7px var(--space-4) 7px calc(var(--space-4) - 3px);
    cursor: pointer;
  }
  .ranked li button:hover { background: var(--neutral-soft); }
  .ranked li button[aria-pressed="true"] { background: rgba(33, 87, 243, 0.14); border-left-color: var(--supply); }
  .ranked .sym { font-weight: 700; }
  .ranked .co { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ranked .amt { text-align: right; font-weight: 600; }
  .ranked .meta { grid-column: 2 / -1; display: flex; align-items: center; gap: var(--space-2); color: var(--faint); font-size: 12px; }
  .ranked .bar { flex: 1; height: 3px; border-radius: 2px; background: var(--neutral-soft); overflow: hidden; }
  .ranked .bar i { display: block; height: 100%; }
  .ranked .empty { padding: var(--space-5) var(--space-4); color: var(--muted); text-align: center; }
  .tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 1px 6px;
    border-radius: 4px;
    vertical-align: 1px;
  }
  .tag.cluster { background: var(--buy-soft); color: var(--buy-text); }
  .tag.cluster.sell { background: var(--sell-soft); color: var(--sell-text); }
  .tag.tracked { background: rgba(33, 87, 243, 0.2); color: var(--accent); }
  .tag.big { background: rgba(224, 195, 74, 0.15); color: #e0c34a; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border); min-height: 44px; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(33, 87, 243, 0.18);
    border: 1px solid var(--supply);
    border-radius: 999px;
    padding: 3px 4px 3px 10px;
    font-size: 12px;
  }
  .pill button { background: none; border: 0; cursor: pointer; color: var(--muted); padding: 0 6px; font-size: 14px; line-height: 1; }
  .pill button:hover { color: var(--text); }
  .link-btn { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; }
  .link-btn:hover { text-decoration: underline; }

  .table-wrap { overflow: auto; max-height: 75vh; border-radius: 0 0 var(--radius) var(--radius); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--panel);
    text-align: right;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    padding: 0;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  thead th button {
    all: unset;
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: var(--space-3) var(--space-4);
    text-align: inherit;
    cursor: pointer;
  }
  thead th button:hover, thead th[aria-sort] button { color: var(--text); }
  thead th button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  thead th[aria-sort="descending"] button::after { content: " ↓"; }
  thead th[aria-sort="ascending"] button::after { content: " ↑"; }
  th.l, td.l { text-align: left; }
  tbody td {
    padding: var(--space-2) var(--space-4);
    border-bottom: 1px solid var(--border);
    text-align: right;
    white-space: nowrap;
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(33, 87, 243, 0.08); }
  tbody tr td:first-child { border-left: 3px solid transparent; }
  tbody tr.buy td:first-child { border-left-color: var(--buy); }
  tbody tr.sell td:first-child { border-left-color: var(--sell); }
  tbody tr.buy td { background: rgba(38, 166, 154, 0.05); }
  td .primary { display: block; }
  td .secondary { display: block; color: var(--faint); font-size: 12px; }
  td a.ext { text-decoration: none; border-bottom: 1px dotted var(--faint); }
  td a.ext:hover { color: var(--accent); border-bottom-color: var(--accent); }
  td a.sym { font-weight: 700; text-decoration: none; }
  td a.sym:hover { color: var(--accent); }
  td.company, td.person { max-width: 260px; }
  td.company .secondary, td.person .primary, td.person .secondary { overflow: hidden; text-overflow: ellipsis; }
  .type { display: inline-flex; align-items: center; gap: 8px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .pos { color: var(--buy-text); }
  .neg { color: var(--sell-text); }
  td.empty { text-align: center; color: var(--muted); padding: var(--space-6); }
  .more-row { display: flex; justify-content: center; padding: var(--space-3); border-top: 1px solid var(--border); }
  .more-row button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 13px;
  }
  .more-row button:hover { border-color: var(--supply); }

  .note { padding: 56px var(--space-6); color: var(--muted); text-align: center; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); }
  .note h2 { color: var(--text); font-size: 18px; margin: 0 0 var(--space-2); }
  .note p { margin: 0 auto; max-width: 560px; }
  .note.err { border-color: rgba(239, 83, 80, 0.4); }
  .note.err h2 { color: var(--sell-text); }
  .note .actions { margin-top: var(--space-4); }
  .note .actions button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    cursor: pointer;
  }

  .skeleton { display: grid; gap: var(--space-3); }
  .skeleton .status { color: var(--muted); display: flex; align-items: center; gap: var(--space-2); }
  .sk { border-radius: var(--radius); background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 50%, var(--panel) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border: 1px solid var(--border); }
  .sk-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .source { color: var(--faint); font-size: 12px; margin-top: var(--space-3); }

  @media (max-width: 1000px) {
    .leaders { grid-template-columns: 1fr; }
    .search-field { margin-left: 0; flex: 1 1 100%; }
    #search { width: 100%; }
  }
  @media (max-width: 760px) {
    header { flex-wrap: wrap; padding: var(--space-3) var(--space-4); height: auto; }
    header .page-nav { margin-left: 0; flex-wrap: wrap; flex-shrink: 1; min-width: 0; }
    main { padding: var(--space-4); }
    .kpis, .sk-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .title-row .updated { margin-left: 0; width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sk, .spin { animation: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>Supply &amp; Demand Dashboard</h1>
    <nav class="page-nav">
      <a class="nav-link" href="list.html">List view</a>
      <a class="nav-link" href="chart.html">Chart view</a>
      <a class="nav-link" href="insider.html">Insider trades</a>
      <a class="nav-link" aria-current="page">Insider feed</a>
      <a class="nav-link" href="steady.html">Steady climbers</a>
      <a class="nav-link" href="japan.html">Bond flows</a>
    </nav>
  </header>

  <main>
    <div class="title-row">
      <h2>Latest insider trades</h2>
      <span class="sub">Open-market buys and sales filed on SEC Form 4, all US stocks</span>
      <span class="updated" id="updated"></span>
    </div>

    <div class="controls">
      <div class="segmented" id="period" role="group" aria-label="Filed within">
        <button type="button" data-days="1">Today</button>
        <button type="button" data-days="3">3D</button>
        <button type="button" data-days="7">1W</button>
        <button type="button" data-days="14">2W</button>
        <button type="button" data-days="30">1M</button>
      </div>
      <div class="segmented kind" id="kind" role="group" aria-label="Transaction type">
        <button type="button" data-kind="all">Buys &amp; sales</button>
        <button type="button" data-kind="buy">Buys</button>
        <button type="button" data-kind="sell">Sales</button>
      </div>
      <select id="min-value" aria-label="Minimum trade value">
        <option value="0">Any size</option>
        <option value="100000">$100K+</option>
        <option value="1000000">$1M+</option>
        <option value="10000000">$10M+</option>
      </select>
      <button type="button" class="toggle" id="tracked-only" aria-pressed="false">My tickers only</button>
      <label class="search-field">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.8"/><path d="m10.6 10.6 3.4 3.4"/></svg>
        <input id="search" type="search" placeholder="Filter ticker, company, insider… (/)" aria-label="Filter trades" autocomplete="off" spellcheck="false" />
      </label>
    </div>

    <div id="result"></div>
  </main>

  <script src="feed.js"></script>
</body>
</html>
