<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Supply &amp; Demand Dashboard</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0e1117;
    --panel: #161b22;
    --border: #2a3038;
    --text: #e6e6e6;
    --muted: #9aa4af;
    --supply: #2157f3;
    --demand: #ff5d00;
    --equilibrium: #9a9a9a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0; }
  header .symbol { color: var(--muted); font-size: 14px; }
  #refresh {
    margin-left: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  #refresh:hover { border-color: var(--supply); }
  #range-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
  }
  .range-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    line-height: 1.2;
  }
  .range-btn:hover { border-color: var(--supply); }
  .range-btn.active { background: var(--supply); border-color: var(--supply); color: #fff; }
  .range-btn .range-pct { font-size: 10px; font-weight: 600; color: var(--muted); }
  #chart-wrap { position: relative; width: 100%; height: 62vh; }
  #chart { width: 100%; height: 100%; }
  .zone-box {
    position: absolute;
    left: 0;
    right: 0;
    display: none;
    pointer-events: none;
    z-index: 5;
  }
  .zone-box.supply { background: rgba(33, 87, 243, 0.18); border-top: 1px solid rgba(33, 87, 243, 0.9); border-bottom: 1px solid rgba(33, 87, 243, 0.5); }
  .zone-box.demand { background: rgba(255, 93, 0, 0.18); border-top: 1px solid rgba(255, 93, 0, 0.5); border-bottom: 1px solid rgba(255, 93, 0, 0.9); }
  .zone-box .zone-label {
    position: absolute;
    top: 4px;
    left: 8px;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    color: #fff;
  }
  .zone-box.supply .zone-label { background: rgba(33, 87, 243, 0.85); }
  .zone-box.demand .zone-label { background: rgba(255, 93, 0, 0.85); bottom: 4px; top: auto; }
  #ohlc-legend {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 6;
    pointer-events: none;
    font-size: 12px;
    line-height: 1.5;
    text-shadow: 0 0 4px rgba(0,0,0,0.9), 0 0 2px rgba(0,0,0,0.9);
    white-space: nowrap;
  }
  #ohlc-legend .legend-symbol { font-weight: 700; margin-right: 8px; }
  #ohlc-legend .legend-field { color: var(--muted); margin-right: 2px; }
  #ohlc-legend .legend-value { margin-right: 8px; }
  #ohlc-legend .legend-change { font-weight: 600; }
  .panels {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 16px 20px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
  }
  .panel h2 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .panel.supply h2 { color: var(--supply); }
  .panel.demand h2 { color: var(--demand); }
  .panel.equilibrium h2 { color: var(--equilibrium); }
  .row { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; color: var(--muted); }
  .row b { color: var(--text); font-weight: 600; }
  #status { padding: 0 20px 16px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>Supply &amp; Demand Dashboard</h1>
    <span class="symbol" id="symbol-label">loading…</span>
    <button id="refresh">Refresh data</button>
  </header>

  <div id="range-bar">
    <button class="range-btn" data-range="1D"><span>1D</span><span class="range-pct" data-pct="1D">–</span></button>
    <button class="range-btn" data-range="1W"><span>1W</span><span class="range-pct" data-pct="1W">–</span></button>
    <button class="range-btn" data-range="1M"><span>1M</span><span class="range-pct" data-pct="1M">–</span></button>
    <button class="range-btn" data-range="3M"><span>3M</span><span class="range-pct" data-pct="3M">–</span></button>
    <button class="range-btn" data-range="6M"><span>6M</span><span class="range-pct" data-pct="6M">–</span></button>
    <button class="range-btn" data-range="1Y"><span>1Y</span><span class="range-pct" data-pct="1Y">–</span></button>
    <button class="range-btn" data-range="2Y"><span>2Y</span><span class="range-pct" data-pct="2Y">–</span></button>
    <button class="range-btn" id="reset-zoom" title="Reset zoom (Alt+R)"><span>Reset Zoom</span></button>
  </div>

  <div id="chart-wrap">
    <div id="chart"></div>
    <div id="ohlc-legend">
      <span class="legend-symbol" id="legend-symbol"></span>
      <span class="legend-field">O</span><span class="legend-value" id="legend-open">–</span>
      <span class="legend-field">H</span><span class="legend-value" id="legend-high">–</span>
      <span class="legend-field">L</span><span class="legend-value" id="legend-low">–</span>
      <span class="legend-field">C</span><span class="legend-value" id="legend-close">–</span>
      <span class="legend-change" id="legend-change"></span>
    </div>
    <div id="supply-box" class="zone-box supply"><span class="zone-label">Supply Zone</span></div>
    <div id="demand-box" class="zone-box demand"><span class="zone-label">Demand Zone</span></div>
  </div>

  <div class="panels">
    <div class="panel supply">
      <h2>Supply Zone</h2>
      <div class="row"><span>Top</span><b id="supply-top">–</b></div>
      <div class="row"><span>Bottom</span><b id="supply-btm">–</b></div>
      <div class="row"><span>Average</span><b id="supply-avg">–</b></div>
      <div class="row"><span>Weighted</span><b id="supply-wavg">–</b></div>
    </div>
    <div class="panel equilibrium">
      <h2>Equilibrium</h2>
      <div class="row"><span>Average</span><b id="equi-avg">–</b></div>
      <div class="row"><span>Weighted</span><b id="equi-wavg">–</b></div>
      <div class="row"><span>Last Close</span><b id="last-close">–</b></div>
      <div class="row"><span>Position</span><b id="zone-position">–</b></div>
    </div>
    <div class="panel demand">
      <h2>Demand Zone</h2>
      <div class="row"><span>Top</span><b id="demand-top">–</b></div>
      <div class="row"><span>Bottom</span><b id="demand-btm">–</b></div>
      <div class="row"><span>Average</span><b id="demand-avg">–</b></div>
      <div class="row"><span>Weighted</span><b id="demand-wavg">–</b></div>
    </div>
  </div>

  <div id="status"></div>

  <script src="app.js"></script>
</body>
</html>
