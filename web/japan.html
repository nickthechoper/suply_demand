<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Japan Bond Flows — Supply &amp; Demand Dashboard</title>
<script src="https://unpkg.com/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
  :root {
    --bg: #0e1117;
    --panel: #161b22;
    --panel-2: #1c222b;
    --border: #2a3038;
    --text: #e6e6e6;
    --muted: #9aa4af;
    --faint: #6b7580;
    --supply: #2157f3;
    --accent: #6f96ff;
    --pos: #4fd1c5;
    --neg: #ef8b88;

    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 28px;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    background: var(--bg);
    color: var(--text);
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }

  header {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    height: 68px;
    padding: 0 var(--space-6);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0; }
  header .page-nav { display: flex; gap: var(--space-3); margin-left: auto; flex-shrink: 0; }
  header .nav-link {
    line-height: 18px;
    white-space: nowrap;
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    border: 1px solid var(--border);
    padding: var(--space-2) var(--space-4);
    border-radius: 8px;
  }
  header .nav-link:hover { border-color: var(--supply); }
  header .nav-link[aria-current="page"] { background: var(--supply); border-color: var(--supply); color: #fff; cursor: default; user-select: none; }

  main { max-width: 1440px; margin: 0 auto; padding: var(--space-5) var(--space-6) var(--space-6); }

  .title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2) var(--space-3); margin-bottom: var(--space-4); }
  .title-row h2 { margin: 0; font-size: 22px; }
  .title-row .period { color: var(--muted); font-size: 13px; }

  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); margin-bottom: var(--space-3); }
  .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-3) var(--space-4); }
  .kpi .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .kpi .v { font-size: 24px; font-weight: 700; margin-top: 2px; }
  .kpi .n { color: var(--muted); font-size: 12px; }
  .pos { color: var(--pos); }
  .neg { color: var(--neg); }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; }
  .card-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-2) var(--space-3);
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--border);
  }
  .card-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .card-head .hint { color: var(--faint); font-size: 12px; }
  .card-head .tools { margin-left: auto; display: flex; gap: var(--space-2); }

  .legend { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); padding: var(--space-3) var(--space-4) 0; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  .legend i.line { height: 2px; width: 14px; border-radius: 1px; }

  .segmented {
    display: inline-flex;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
  }
  .segmented button {
    background: none;
    border: 0;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  .segmented button:hover { color: var(--text); }
  .segmented button[aria-pressed="true"] { background: var(--supply); color: #fff; font-weight: 600; }

  .chart-body { display: flex; flex-direction: column; height: 660px; padding: var(--space-3); }
  .panel { position: relative; min-height: 0; }
  .panel.ea { flex: 3; }
  .panel.us { flex: 2; }
  .panel-title { font-size: 12px; font-weight: 600; color: var(--text); padding: 0 0 var(--space-1) var(--space-2); }
  .panel-title span { color: var(--faint); font-weight: 400; margin-left: var(--space-1); }
  .panel ~ .panel-title { margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border); }

  .table-wrap { overflow: auto; max-height: 620px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  thead th {
    position: sticky;
    top: 0;
    background: var(--panel);
    text-align: right;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td { padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  th.l, td.l { text-align: left; }
  tbody tr:hover td { background: rgba(33, 87, 243, 0.08); }
  td.strong { font-weight: 600; }

  .source { color: var(--faint); font-size: 12px; margin-top: var(--space-3); }

  .note { padding: 56px var(--space-6); color: var(--muted); text-align: center; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); }
  .note h2 { color: var(--text); font-size: 18px; margin: 0 0 var(--space-2); }
  .note.err { border-color: rgba(239, 83, 80, 0.4); }
  .note.err h2 { color: var(--neg); }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: var(--space-2); }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 760px) {
    header { flex-wrap: wrap; padding: var(--space-3) var(--space-4); height: auto; }
    header .page-nav { margin-left: 0; flex-wrap: wrap; flex-shrink: 1; min-width: 0; }
    main { padding: var(--space-4); }
    .kpis { grid-template-columns: 1fr; }
    .chart-body { height: 540px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>Supply &amp; Demand Dashboard</h1>
    <nav class="page-nav">
      <a class="nav-link" href="list.html">List view</a>
      <a class="nav-link" href="chart.html">Chart view</a>
      <a class="nav-link" href="insider.html">Insider trades</a>
      <a class="nav-link" aria-current="page">Japan flows</a>
    </nav>
  </header>

  <main>
    <div class="title-row">
      <h2>Are Japanese investors going back home?</h2>
      <span class="period" id="period"></span>
    </div>

    <div id="result">
      <div class="note"><span class="spin"></span>Downloading Bank of Japan balance of payments data…</div>
    </div>
  </main>

  <script src="japan.js"></script>
</body>
</html>
